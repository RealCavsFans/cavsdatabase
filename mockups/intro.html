<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>First-visit intro preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0;height:100%}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
.intro{position:fixed;inset:0;z-index:10;background:#101419;color:#EEF0EC;display:flex;align-items:center;justify-content:center;transition:opacity .6s,transform .6s}
.intro.out{opacity:0;transform:scale(1.03);pointer-events:none}
.ln{font:500 clamp(18px,3.4vw,40px) 'Geist Mono',monospace;white-space:pre;max-width:92vw;overflow:hidden}.ln b{color:#F2B231;margin-right:.5em}
.cur{display:inline-block;width:.5em;height:1.05em;background:#F2B231;vertical-align:-.18em;margin-left:.08em;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.br{position:absolute;inset:0;background:#7A1F33;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;text-align:center;padding:0 16px}
.br.on{opacity:1}.logo{width:clamp(64px,9vw,110px)}.wm{font:600 clamp(56px,11vw,132px)/1 'Geist Mono',monospace;color:#fff;margin-top:10px;letter-spacing:-.03em}.wm span{color:#F2B231}
h1{font:600 clamp(18px,3.2vw,40px)/1.25 Archivo,sans-serif;color:#fff;margin:22px 0 0;opacity:0;transform:translateY(8px);transition:all .45s}h1.on{opacity:1;transform:none}h1 em{font-style:normal;color:#F2B231}
.skip{position:absolute;right:18px;bottom:18px;z-index:2;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;font:600 13px Archivo,sans-serif;padding:8px 14px;cursor:pointer}
.ctl{position:fixed;left:12px;bottom:12px;z-index:20;display:flex;gap:6px}.ctl button{font:700 12px Archivo,sans-serif;background:#F2B231;border:0;padding:8px 12px;cursor:pointer}
</style></head><body>
<iframe src="/" title="cavsdatabase.com"></iframe>
<div class="intro" id="intro"><div class="ln"><b>&gt;</b><span id="t"></span><i class="cur"></i></div>
 <div class="br" id="br"><svg viewBox="0 0 100 100" class="logo"><g transform="translate(8 6) scale(.84)"><path d="M14 26L40 50L14 74" stroke="#F2B231" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="70" cy="64" r="20" fill="#F2B231"/><path d="M50 64H90M70 44V84M57 49C63 55 63 73 57 79M83 49C77 55 77 73 83 79" stroke="#7A1F33" stroke-width="2.5" fill="none"/></g></svg><div class="wm">cavs_<span>db</span><i class="cur"></i></div><h1 id="tg">Everything Cavaliers. <em>Everything you need.</em></h1></div>
 <button class="skip" id="skip" type="button">Skip</button></div>
<div class="ctl"><button type="button" id="rp">Replay intro</button></div>
<script>
const Q=['how much cap space do the cavs have?','who does the 2027 first go to?','when is the trade deadline?'];
const I=document.getElementById('intro'),T=document.getElementById('t'),B=document.getElementById('br'),G=document.getElementById('tg');let run=0;
const sl=ms=>new Promise(r=>setTimeout(r,ms));
async function play(){const me=++run;I.classList.remove('out');B.classList.remove('on');G.classList.remove('on');T.textContent='';
 await sl(350);for(const q of Q){for(const c of q){if(me!==run)return;T.textContent+=c;await sl(34)}await sl(420);while(T.textContent.length){if(me!==run)return;T.textContent=T.textContent.slice(0,-1);await sl(10)}await sl(120)}
 if(me!==run)return;B.classList.add('on');await sl(70);B.classList.remove('on');await sl(70);B.classList.add('on');await sl(320);G.classList.add('on');await sl(1300);if(me!==run)return;I.classList.add('out')}
document.getElementById('skip').onclick=()=>{run++;I.classList.add('out')};document.getElementById('rp').onclick=play;play();
</script></body></html>
