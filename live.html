<style>

@font-face{font-family:'Geist Mono';font-style:normal;font-display:swap;font-weight:100 900;src:url(/fonts/geist-mono-latin-wght-normal.woff2) format('woff2')}

:root{--wine:#860038;--gold:#F2B231;--ink:#101419;--bg:#f7f5f2;--card:#fff;--sub:#f4f1ec;--fg:#101419;--fg2:#3a3f46;--muted:#6b7078;--line:#e3e0db;--line2:#eeebe7;--track:#ebe8e3;--opp:#5b6470;--miss:#8a9099;--pos:#1d6b3a;--neg:#a3122e;--sans:'Archivo',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;--cond:'Saira Condensed','Archivo',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 0.9375rem/1.45 var(--sans)}
a{color:var(--wine)}
button{font-family:inherit}
.top{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top a{color:#fff;text-decoration:none;font:800 1rem var(--cond);letter-spacing:.04em;text-transform:uppercase}
.top a b{color:var(--gold)}
.top .tag{font:600 0.6875rem var(--mono);color:#c9ccd1;letter-spacing:.06em;text-transform:uppercase}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.pick{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.pick label{font:700 0.75rem var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pick select{flex:1;min-width:0;max-width:540px;font:500 0.875rem var(--sans);padding:9px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:0}
.card{background:var(--card);border:1px solid var(--line);padding:16px}
.sec{margin-top:14px}
/* scoreboard */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-top:3px solid var(--wine)}
.tm{display:flex;align-items:center;gap:10px;min-width:0}
.tm.h{flex-direction:row-reverse;text-align:right}
.tm img{width:44px;height:44px;flex:none}
.tm .nm{font:800 1.125rem var(--cond);letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.tm .rc{font:500 0.75rem var(--mono);color:var(--muted)}
.tm .sc{font:700 2.5rem var(--mono);letter-spacing:-.02em;margin-left:auto;font-variant-numeric:tabular-nums}
.tm.h .sc{margin-left:0;margin-right:auto}
.tm.lose .sc{color:var(--muted)}
.mid{text-align:center;min-width:92px}
.mid .st{font:800 1.125rem var(--cond);letter-spacing:.06em;text-transform:uppercase}
.mid .ck{font:600 1.25rem var(--mono)}
.pill{display:inline-block;margin-top:4px;padding:2px 8px;font:700 0.6875rem var(--sans);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.pill.live{background:var(--wine);border-color:var(--wine);color:#fff}
.pill.live::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:1px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.ls{grid-column:1/-1;width:100%;border-collapse:collapse;font:500 0.8125rem var(--mono);margin-top:4px}
.ls th,.ls td{padding:5px 6px;text-align:center;border-top:1px solid var(--line2)}
.ls th{font:700 0.6875rem var(--cond);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ls td:first-child,.ls th:first-child{text-align:left;font-weight:700}
.ls td:last-child{font-weight:700}
.wp{grid-column:1/-1}
.wp-h{display:flex;justify-content:space-between;font:600 0.75rem var(--sans);color:var(--muted);margin-bottom:4px}
.wp-h b{color:var(--fg);font-family:var(--mono)}
.wp-bar{display:flex;height:8px;background:var(--track)}
.wp-bar i{display:block;height:100%}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font:500 0.75rem var(--sans);color:var(--muted);margin:8px 0 6px}
.meta button{font:600 0.75rem var(--sans);background:none;border:0;color:var(--wine);text-decoration:underline;cursor:pointer;padding:0}
.rp{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-top:12px;border-top:1px solid var(--line2)}
.rp button{font:700 0.8125rem var(--sans);background:var(--wine);color:#fff;border:0;padding:8px 14px;min-width:84px;cursor:pointer}
.rp input[type=range]{width:100%;accent-color:var(--wine)}
.rp select{font:500 0.8125rem var(--sans);padding:6px;border:1px solid var(--line);background:var(--card)}
.rp .lbl{grid-column:1/-1;font:500 0.75rem var(--sans);color:var(--muted)}
/* sticky nav: tabs + period filter */
.stick{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px 14px;padding:0 16px;border-bottom:1px solid var(--line)}
.seg{display:flex;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;font:800 0.9375rem var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.seg button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--wine)}
.per{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 10px;align-items:center}
.per::-webkit-scrollbar{display:none}
.per span{font:700 0.6875rem var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px;flex:none}
.per button{flex:none;font:600 0.8125rem var(--sans);padding:6px 11px;border:1px solid var(--line);background:var(--card);color:var(--fg2);cursor:pointer}
.per button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.per button:disabled{opacity:.35;cursor:default}
.per i{width:1px;height:20px;background:var(--line);flex:none;margin:0 2px}
h2{font:800 1.125rem var(--cond);letter-spacing:.05em;text-transform:uppercase;margin:0 0 4px}
.sub{font-size:0.8125rem;color:var(--muted);margin:0 0 12px}
h3{font:700 0.75rem var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.empty{color:var(--muted);font-size:0.875rem;padding:8px 0}
.key{display:flex;gap:14px;flex-wrap:wrap;font:500 0.75rem var(--sans);color:var(--muted);margin-top:8px}
.key i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto}
.note{font-size:0.75rem;color:var(--muted);margin:10px 0 0}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fl button{font:600 0.8125rem var(--sans);padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg2);cursor:pointer}
.fl button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.fl select{font:500 0.8125rem var(--sans);padding:7px;border:1px solid var(--line);background:var(--card);max-width:100%}
.fl .lab{font:700 0.6875rem var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* team compare */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin-bottom:10px}
.vs .t{font:800 1rem var(--cond);letter-spacing:.04em;text-transform:uppercase}
.vs .t.r{text-align:right}
.vs .big{font:700 2rem var(--mono)}
.vs .c{font:600 0.75rem var(--sans);color:var(--muted);text-align:center;padding-bottom:8px}
.cmp{width:100%;border-collapse:collapse}
.cmp td{padding:7px 0;border-top:1px solid var(--line2);font:500 0.875rem var(--mono);vertical-align:middle}
.cmp td.l{text-align:center;font:600 0.75rem var(--sans);color:var(--muted);width:34%}
.cmp td.b{width:16%}
.cmp td:last-child{text-align:right}
.cmp .w{font-weight:800;color:var(--fg)}
.cmp tr.gh td{border-top:0;padding-top:14px;font:700 0.6875rem var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left}
.mb{display:flex;height:6px;background:var(--track)}
.mb.r{flex-direction:row-reverse}
.mb i{display:block;height:100%}
.runs{list-style:none;margin:0;padding:0}
.runs li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line2);font-size:0.875rem}
.runs li:first-child{border-top:0}
.runs small{font:500 0.75rem var(--mono);color:var(--muted)}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font:500 0.8125rem var(--mono)}
.dt th{font:700 0.6875rem var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt th button{all:unset;cursor:pointer}
.dt th button:focus-visible{outline:2px solid var(--wine)}
.dt th.on{color:var(--fg)}
.dt th.on button::after{content:' ▾'}
.dt th.on.asc button::after{content:' ▴'}
.dt td{text-align:right;padding:7px 6px;border-top:1px solid var(--line2);white-space:nowrap;font-variant-numeric:tabular-nums}
.dt th:first-child,.dt td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-family:var(--sans);font-weight:600;z-index:1}
.dt td:first-child{min-width:132px;max-width:210px;white-space:normal}
.dt tr.tot td{font-weight:800;border-top:1px solid var(--line)}
.dt tr.dnp td{color:var(--muted)}
.dt .k{font-weight:800}
.dt tr.now td:first-child{box-shadow:inset 3px 0 0 var(--gold);padding-left:9px}
.pm{font-weight:800}.pm.p{color:var(--pos)}.pm.n{color:var(--neg)}
.oc{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:1px}
.oc.off{background:transparent}
.pos{color:var(--muted);font-weight:500;font-size:0.6875rem;margin-left:4px}
.five{display:flex;flex-wrap:wrap;gap:6px}
.five span{padding:6px 10px;background:var(--sub);font:600 0.8125rem var(--sans)}

.zchart{max-width:480px;margin:0 auto}
.leg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font:500 0.75rem var(--sans);color:var(--muted);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.zt{width:100%;border-collapse:collapse;font:500 0.8125rem var(--mono)}
.zt th{font:700 0.6875rem var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
.zt td{text-align:right;padding:7px 4px;border-top:1px solid var(--line2)}
.zt th:first-child,.zt td:first-child{text-align:left;font-family:var(--sans)}

.ff{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ffc{border:1px solid var(--line2);padding:12px}
.ffc .n{font:700 0.75rem var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ffc .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.ffc .row b{font:700 1.25rem var(--mono)}
.ffc .row span{font:700 0.8125rem var(--cond);letter-spacing:.06em}
.ffc .edge{margin-top:8px;font:600 0.75rem var(--sans)}
.ffc .bar{display:flex;height:6px;margin-top:4px;background:var(--track)}
.ffc .bar i{display:block;height:100%}
.ffq td.e{font-weight:800}
.chip{display:inline-block;width:8px;height:8px;margin-right:6px}
/* rotation */
.rot{font:500 0.75rem var(--sans)}
.rot .r{display:grid;grid-template-columns:116px 1fr 44px;gap:8px;align-items:center;padding:3px 0}
.rot .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:0.8125rem}
.rot .ln{position:relative;height:18px;background:var(--sub)}
.rot .ln b{position:absolute;top:2px;bottom:2px}
.rot .ln u{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.rot .ln s{position:absolute;top:0;bottom:0;background:rgba(247,245,242,.72);text-decoration:none}
.rot .mn{font:600 0.75rem var(--mono);text-align:right}
.rot .ax{display:grid;grid-template-columns:116px 1fr 44px;gap:8px;font:600 0.6875rem var(--mono);color:var(--muted);margin-top:4px}
.rot .ax div{position:relative;height:14px}
.rot .ax em{position:absolute;transform:translateX(-50%);font-style:normal}
.plays{list-style:none;margin:0;padding:0}
.plays li{display:grid;grid-template-columns:52px 6px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:0.875rem}
.plays .t{font:500 0.75rem var(--mono);color:var(--muted)}
.plays .c{width:6px;height:100%;min-height:18px}
.plays .s{font:600 0.8125rem var(--mono);color:var(--muted);white-space:nowrap}
.plays li.sc .x{font-weight:700}
.plays li.sc .s{color:var(--fg)}
.plays li.pd{display:block;font:700 0.6875rem var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--sub);padding:6px 8px;margin:4px 0;border:0}
.foot{font-size:0.75rem;color:var(--muted);text-align:center;padding:20px 16px 40px}
@media (max-width:760px){
 .grid2{grid-template-columns:1fr}
 .ff{grid-template-columns:1fr 1fr}
 .tm img{width:32px;height:32px}
 .tm .sc{font-size:2rem}
 .tm .nm{font-size:1rem}
 .mid{min-width:70px}
 .rot .r,.rot .ax{grid-template-columns:84px 1fr 36px;gap:6px}
 .cmp td.b{width:12%}
 table.dt{width:max-content;min-width:100%!important}
 .dt td:first-child{width:150px;min-width:150px;max-width:150px}
}
@media (max-width:420px){.tm{gap:6px}.tm .rc{display:none}.tm .sc{font-size:1.75rem}}
</style>

async function choose(v,push){

  focus.c='#860038';other.c='#5b6470';focus.c2='color-mix(in srgb,#860038 22%,#fff)';other.c2='color-mix(in srgb,#5b6470 22%,#fff)';

}

/* ---------- derive: one pass over the revealed plays ---------- */

function derive(){

    const first={},order=[];byPer[per].forEach(p=>p.ids.forEach((id,i)=>{if(teamOf(id)!==t||first[id])return;const sin=p.type==='Substitution'&&i===0;first[id]=sin?'in':'on';if(!sin)order.push(id)}));

    if(per===1){const st=D.roster[t].filter(id=>D.P[id].starter);five=st.length===5?st:five.concat(st.filter(x=>!five.includes(x))).slice(0,5)}

    const on=new Set(five);byPer[per].forEach(p=>{if(p.type==='Substitution'&&p.ids[0]&&p.ids[1]&&teamOf(p.ids[0])===t){on.delete(p.ids[1]);on.add(p.ids[0])}});prevEnd[t]=[...on]})});

  const on={};tid.forEach(t=>on[t]=new Set());
  const L={};tid.forEach(t=>L[t]={2:{},3:{},5:{}});
  const lkCache={};
  const lineKeys=(t,set)=>{const ids=[...set].sort();const k=t+'|'+ids.join(',');if(lkCache[k])return lkCache[k];const out=[];[2,3,5].forEach(n=>{if(ids.length>=n)combos(ids,n).forEach(c=>out.push([n,c.join(','),c]))});return lkCache[k]=out};

  const stints={},enter={},pmAll={};Object.keys(D.P).forEach(id=>pmAll[id]=0);
  let last=0,curPer=0,snap=null;const src={};tid.forEach(t=>src[t]='');
  const margin=[[0,0]];let lc=0,ties=0,prevSign=0;const lead={};tid.forEach(t=>lead[t]=0);

      else{const three=p.pa===3;const zi=p.x!=null?zoneOf(p.x,p.y,three):(three?4:1);const paint=!three&&p.x!=null&&Math.abs(p.x-25)<=8&&p.y<=13.75;

}
function dotCourt(sh,col){const Sx=8,W=50*Sx,Hh=36*Sx,x=v=>v*Sx,y=v=>(v+5.25)*Sx;
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Shot chart, ${sh.length} shots"><rect width="${W}" height="${Hh}" fill="var(--sub)"/><g fill="none" stroke="var(--line)" stroke-width="2"><rect x="${x(17)}" y="0" width="${16*Sx}" height="${19*Sx}"/><circle cx="${x(25)}" cy="${y(13.75)}" r="${6*Sx}"/><path d="M${x(3)} 0 V${y(C3)} A${23.75*Sx} ${23.75*Sx} 0 0 0 ${x(47)} ${y(C3)} V0"/><path d="M${x(21)} ${y(0)} A${4*Sx} ${4*Sx} 0 0 0 ${x(29)} ${y(0)}"/></g><circle cx="${x(25)}" cy="${y(0)}" r="${0.75*Sx}" fill="none" stroke="var(--muted)" stroke-width="2"/>`;
  sh.forEach(q=>{if(q.y>30.5)return;const a=Math.max(.4,Math.min(49.6,q.x)),b=Math.max(-4.5,q.y);s+=q.m?`<circle cx="${x(a)}" cy="${y(b)}" r="4" fill="${col}" opacity=".85"><title>${esc(q.text)} · ${pname(q.per)} ${q.clock}</title></circle>`:`<path d="M${x(a)-3} ${y(b)-3}l6 6M${x(a)+3} ${y(b)-3}l-6 6" stroke="var(--miss)" stroke-width="1.8"><title>${esc(q.text)} · ${pname(q.per)} ${q.clock}</title></path>`});
  return s+'</svg>'}
function vShots(v,D,R){
  if(!S.f.shTeam)S.f.shTeam=D.focus.id;const t=D.teams.find(x=>x.id===S.f.shTeam);
  const c=el('div','card');head(c,'Shot chart',perLabel(S.per)+' · field goals only');
  const fl=teamBtns(D,'shTeam',()=>S.f.shPl='all');
  const ps=el('select');ps.setAttribute('aria-label','Player');const o0=el('option',null,'Whole team');o0.value='all';ps.appendChild(o0);
  const cnt={};R.shots.filter(s=>s.t===t.id).forEach(s=>cnt[s.id]=(cnt[s.id]||0)+1);
  Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).forEach(id=>{const o=el('option',null,D.P[id].name+' · '+cnt[id]+' FGA');o.value=id;if(S.f.shPl===id)o.selected=true;ps.appendChild(o)});
  ps.onchange=()=>{S.f.shPl=ps.value;renderView()};fl.appendChild(ps);
  [['zones','Zones'],['dots','Every shot']].forEach(([k,l])=>{const b=el('button',null,l);b.type='button';b.setAttribute('aria-pressed',S.f.shView===k);b.onclick=()=>{S.f.shView=k;renderView()};fl.appendChild(b)});
  c.appendChild(fl);
  const sh=R.shots.filter(s=>s.t===t.id&&(S.f.shPl==='all'||s.id===S.f.shPl));
  const Z=ZN.map(()=>[0,0]);sh.forEach(q=>{Z[q.zi][1]++;if(q.m)Z[q.zi][0]++});
  const g=el('div','grid2');const left=el('div','zchart');
  const who=S.f.shPl==='all'?t.abbr:D.P[S.f.shPl].name;
  if(S.f.shView==='zones'){left.innerHTML=zoneCourt(Z,sh.length,who+' shooting by zone');left.insertAdjacentHTML('beforeend',`<div class="leg"><span><i style="background:color-mix(in srgb,#860038 80%,#fff)"></i>Better than NBA average</span><span><i style="background:color-mix(in srgb,#4B5563 70%,#fff)"></i>Worse</span><span>Each zone: makes-attempts, FG% and points above or below average. Zones with fewer than 3 shots stay gray.</span></div>`)}
  else{left.innerHTML=dotCourt(sh,t.c);left.insertAdjacentHTML('beforeend',`<div class="leg"><span><i style="background:${t.c};border-radius:50%"></i>Made</span><span>✕ Missed</span><span>${sh.filter(q=>q.m).length}-${sh.length} FG</span></div>`)}
  const right=el('div');right.appendChild(el('h3',null,who+' by zone'));
  const zt=el('table','zt');zt.innerHTML='<tr><th>Zone</th><th>FG</th><th>FG%</th><th>NBA avg</th><th>Share</th></tr>';
  ZN.forEach(([k,n,dsc],i)=>{const[m,a]=Z[i];const tr=el('tr');const nn=el('td');nn.append(n);if(dsc)nn.appendChild(el('span','pos',dsc));
    const dfc=a?(m/a-LG[k][0]):0;const fg=el('td',null,a?pct(m,a):'–');if(a>=3)fg.style.color=dfc>0.02?'var(--pos)':dfc<-0.02?'var(--neg)':'';fg.style.fontWeight='700';
    tr.append(nn,el('td',null,m+'-'+a),fg,el('td',null,(LG[k][0]*100).toFixed(0)+'%'),el('td',null,sh.length?Math.round(a/sh.length*100)+'%':'–'));zt.appendChild(tr)});
  right.appendChild(zt);
  const pts=Z.reduce((s,[m],i)=>s+m*(i>=3?3:2),0);right.appendChild(el('p','note',`${pts} points on ${sh.length} shots (${sh.length?(pts/sh.length).toFixed(2):'–'} per shot). NBA averages are 2025–26 league-wide by zone.`));
  g.append(left,right);c.appendChild(g);v.appendChild(c);
}

/* ---------- Four factors ---------- */
function factors(a,b){const pa=poss({fga:a.fga,oreb:a.oreb+a.toreb,to:a.to,fta:a.fta});
  return {efg:a.fga?(a.fgm+0.5*a.tpm)/a.fga:null,tov:pa?a.to/pa:null,orb:(a.oreb+a.toreb+b.dreb+b.tdreb)?(a.oreb+a.toreb)/(a.oreb+a.toreb+b.dreb+b.tdreb):null,ftr:a.fga?a.ftm/a.fga:null}}
const FF=[['efg','Shooting','Effective FG%',true],['tov','Ball security','Turnover rate',false],['orb','Second chances','Offensive rebound rate',true],['ftr','Getting to the line','Free throws made per FGA',true]];
function vFF(v,D,R){
  const A=R.T[D.focus.id],B=R.T[D.other.id];const fa=factors(A,B),fb=factors(B,A);
  const c=el('div','card');head(c,'Four factors',perLabel(S.per)+' · the four things that decide most games');
  const g=el('div','ff');
  FF.forEach(([k,n,full,hib])=>{const x=fa[k],y=fb[k];const box=el('div','ffc');box.appendChild(el('div','n',n));
    const f=z=>z==null?'–':(z*100).toFixed(1)+'%';
    [[D.focus,x],[D.other,y]].forEach(([t,val])=>{const r=el('div','row');const sp=el('span');sp.innerHTML=`<i class="chip" style="background:${t.c}"></i>${esc(t.abbr)}`;r.append(sp,el('b',null,f(val)));box.appendChild(r)});
    if(x!=null&&y!=null){const better=(x>y)===hib?D.focus:D.other;const e=el('div','edge',x===y?'Even':better.abbr+' edge');e.style.color=better.c;box.appendChild(e)}
    box.appendChild(el('p','note',full));g.appendChild(box)});
  c.appendChild(g);
  /* who won each factor, quarter by quarter */
  c.appendChild(el('h3',null,'Quarter by quarter'));
  const qs=Object.keys(R.TQ).map(Number).sort((a,b)=>a-b);
  const tb=el('table','zt ffq');const hr=el('tr');hr.appendChild(el('th',null,'Factor'));qs.forEach(q=>hr.appendChild(el('th',null,pname(q))));hr.appendChild(el('th',null,S.per==='all'?'Game':perLabel(S.per)));tb.appendChild(hr);
  FF.forEach(([k,n,full,hib])=>{[D.focus,D.other].forEach((t,ti)=>{const tr=el('tr');const nm=el('td');nm.innerHTML=`<i class="chip" style="background:${t.c}"></i>${ti?'':esc(n)+' · '}${esc(t.abbr)}`;tr.appendChild(nm);
    const cell=(mine,theirs)=>{const td=el('td',null,mine==null?'–':(mine*100).toFixed(0)+'%');if(mine!=null&&theirs!=null&&mine!==theirs&&((mine>theirs)===hib)){td.classList.add('e');td.style.color=t.c}return td};
    qs.forEach(q=>{const me=R.TQ[q][t.id],th=R.TQ[q][t===D.focus?D.other.id:D.focus.id];if(!me||!th){tr.appendChild(el('td',null,'–'));return}tr.appendChild(cell(factors(me,th)[k],factors(th,me)[k]))});
    tr.appendChild(cell((t===D.focus?fa:fb)[k],(t===D.focus?fb:fa)[k]));if(ti===1)tr.style.borderBottom='1px solid var(--line)';tb.appendChild(tr)})});
  const w=el('div','tw');w.appendChild(tb);c.appendChild(w);
  c.appendChild(el('p','note','Bold = won that factor in that stretch. Turnover rate = turnovers per estimated possession. Offensive rebound rate counts team rebounds.'));
  v.appendChild(c);
}

/* ---------- Rotations ---------- */
function vRot(v,D,R){
  if(!S.f.rotTeam)S.f.rotTeam=D.focus.id;const t=D.teams.find(x=>x.id===S.f.rotTeam);
  const c=el('div','card');head(c,t.abbr+' rotation','When each player was on the floor. Bar color shows the score while he was out there.');c.appendChild(teamBtns(D,'rotTeam'));
  const T=pstart(R.maxPer)+plen(R.maxPer);const X=s=>(s/T*100).toFixed(2)+'%';
  const ids=D.roster[t.id].filter(id=>R.stints[id]&&R.stints[id].length).sort((a,b)=>(D.P[b].starter-D.P[a].starter)||(R.stints[a][0][0]-R.stints[b][0][0]));
  const now=R.lp?R.lp.t:0;
  const wrap=el('div','rot');
  ids.forEach(id=>{const r=el('div','r');r.appendChild(el('div','nm',D.P[id].short));const ln=el('div','ln');
    for(let p=2;p<=R.maxPer;p++){const u=el('u');u.style.left=X(pstart(p));ln.appendChild(u)}
    let tot=0;R.stints[id].filter(([a,b])=>b-a>=1).forEach(([a,b,pm])=>{tot+=b-a;const bb=el('b');bb.style.left=X(a);bb.style.width=X(Math.max(b-a,6));bb.style.background=pm>0?D.focus===t?'#860038':'#3d4550':pm<0?'#c9a3ae':'#a9aeb5';if(pm<0&&t!==D.focus)bb.style.background='#c3c7cc';bb.title=`${pname(perAt(a))} · ${fmtMin(b-a)} on the floor · ${sgn(pm)}`;ln.appendChild(bb)});
    if(now<T){const sh=el('s');sh.style.left=X(now);sh.style.width=X(T-now);ln.appendChild(sh)}
    r.append(ln,el('div','mn',fmtMin(tot)));wrap.appendChild(r)});
  const ax=el('div','ax');ax.appendChild(el('span'));const ad=el('div');for(let p=1;p<=R.maxPer;p++){const s=el('em',null,pname(p));s.style.left=X(pstart(p)+plen(p)/2);ad.appendChild(s)}ax.append(ad,el('span'));wrap.appendChild(ax);
  c.appendChild(wrap);
  const k=el('div','key');k.innerHTML=`<span><i style="background:${t===D.focus?'#860038':'#3d4550'}"></i>${esc(t.abbr)} won the stint</span><span><i style="background:${t===D.focus?'#c9a3ae':'#c3c7cc'}"></i>Lost it</span><span><i style="background:#a9aeb5"></i>Even</span>`;c.appendChild(k);
  /* stint table */
  c.appendChild(el('h3',null,'Stints, longest first'));
  const rows=[];ids.forEach(id=>R.stints[id].filter(([a,b])=>b-a>=1).forEach(([a,b,pm])=>rows.push({name:D.P[id].short,a,len:b-a,pm})));
  c.appendChild(dtable('st',[{h:'Player',k:'name'},{h:'IN',k:'a',f:r=>{const p=perAt(r.a);return pname(p)+' '+fmtMin(pstart(p)+plen(p)-r.a)},asc:true},{h:'LENGTH',k:'len',f:r=>fmtMin(r.len)},{h:'+/-',k:'pm',f:r=>sgn(r.pm),cls:r=>pmCls(r.pm)}],rows.slice(0,400),{def:'len',minW:300}));
  v.appendChild(c);
}

/* ---------- Plays ---------- */
function vPlays(v,D,R){
  const c=el('div','card');head(c,'Play-by-play','Newest first · score shown '+D.away.abbr+'–'+D.home.abbr);
  const fl=el('div','fl');[['all','All'],['sc','Scoring'],['focus',D.focus.abbr+' only'],['sub','Substitutions']].forEach(([k,l])=>{const b=el('button',null,l);b.type='button';b.setAttribute('aria-pressed',S.f.plays===k);b.onclick=()=>{S.f.plays=k;renderView()};fl.appendChild(b)});c.appendChild(fl);
  const list=R.plays.slice().reverse().filter(p=>S.f.plays==='sc'?p.sc:S.f.plays==='focus'?p.team===D.focus.id:S.f.plays==='sub'?p.type==='Substitution':true);
  const ul=el('ul','plays');let lp=null;list.slice(0,200).forEach(p=>{if(p.per!==lp){lp=p.per;ul.appendChild(el('li','pd',p.per<=4?['1st','2nd','3rd','4th'][p.per-1]+' quarter':pname(p.per)))}
    const li=el('li',p.sc?'sc':'');const t=D.teams.find(x=>x.id===p.team);const cb=el('span','c');cb.style.background=t?t.c:'transparent';li.append(el('span','t',p.clock),cb,el('span','x',p.text),el('span','s',p.as+'–'+p.hs));ul.appendChild(li)});
  if(!list.length)ul.appendChild(el('li','empty','No plays yet.'));c.appendChild(ul);if(list.length>200)c.appendChild(el('p','note','Showing the latest 200.'));v.appendChild(c);
}

/* ---------- boot ---------- */
(async()=>{const evs=await loadScoreboard();$('gsel').onchange=e=>choose(e.target.value,true);
  let pick=new URLSearchParams(location.search).get('g');
  if(!pick){const cav=evs.find(isCavs),live=evs.find(e=>e.status.type.state==='in');pick=cav?cav.id:live?live.id:'r'+REPLAYS[0][0]}
  choose(pick,false)})();
</script>
