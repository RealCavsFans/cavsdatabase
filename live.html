body{margin:0;background:var(--bg);color:var(--fg);font:400 0.9375rem/1.45 var(--sans)}
a{color:var(--wine-ink)}
.top{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top a{color:#fff;text-decoration:none;font:800 1rem var(--cond);letter-spacing:.04em;text-transform:uppercase}

.pick select{flex:1;min-width:0;max-width:520px;font:500 0.875rem var(--sans);padding:9px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:0}

.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-top:3px solid var(--wine)}
.tm{display:flex;align-items:center;gap:10px;min-width:0}
.tm.h{flex-direction:row-reverse;text-align:right}
.tm img{width:44px;height:44px;flex:none}
.tm .nm{font:800 1.125rem var(--cond);letter-spacing:.03em;text-transform:uppercase;line-height:1.1}

.tm.h .sc{margin-left:0;margin-right:auto}

.mid{text-align:center;min-width:92px}
.mid .st{font:800 1.125rem var(--cond);letter-spacing:.06em;text-transform:uppercase}
.mid .ck{font:600 1.25rem var(--mono)}

@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}

.ls th,.ls td{padding:5px 6px;text-align:center;border-top:1px solid var(--line2)}
.ls th{font:700 0.6875rem var(--cond);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ls td:first-child,.ls th:first-child{text-align:left;font-weight:700}

.wp{grid-column:1/-1}

.sec+.sec{margin-top:14px}
.empty{color:var(--muted);font-size:0.875rem;padding:8px 0}

.lu{width:100%;border-collapse:collapse;font:500 0.8125rem var(--mono)}

.al{list-style:none;margin:0;padding:0;columns:2;column-gap:20px}

@media (max-width:760px){
 .grid2{grid-template-columns:1fr}
 .tm img{width:32px;height:32px}
 .tm .sc{font-size:2rem}
 .tm .nm{font-size:1rem}
 .mid{min-width:70px}
 .al{columns:1}
 .ls{font-size:0.75rem}
}
@media (max-width:420px){
 .tm{gap:6px}.tm .rc{display:none}
 .tm .sc{font-size:1.75rem}
}

/* ---------- derive everything from the revealed plays ---------- */
function derive(){

    const ps=byPer[per];startFive[per]={};
    tid.forEach(t=>{
      const first={};const order=[];
      ps.forEach(p=>{p.ids.forEach((id,i)=>{if(teamOf(id)!==t||first[id])return;
        const subIn=p.type==='Substitution'&&i===0;first[id]=subIn?'in':'on';if(!subIn)order.push(id)})});
      let five=order.slice(0,5);
      if(per===1){const st=D.roster[t].filter(id=>D.P[id].starter);five=st.length===5?st:five.concat(st.filter(x=>!five.includes(x))).slice(0,5)}
      else if(five.length<5){prevEnd[t].forEach(id=>{if(five.length<5&&!five.includes(id)&&first[id]!=='in')five.push(id)})}

  });
  /* walk */
  const stints=[];const lu={};tid.forEach(t=>lu[t]={});
  let last=0,curPer=0;const margin=[[0,0]];let ld=0,lc=0,ties=0,lead={},prevSign=0;
  tid.forEach(t=>lead[t]=0);
  const key=t=>[...on[t]].sort().join(',');
  const addTime=(t1)=>{const dt=t1-last;if(dt>0){tid.forEach(t=>{on[t].forEach(id=>{box[id].min+=dt});const k=key(t);if(on[t].size){(lu[t][k]=lu[t][k]||{ids:[...on[t]],sec:0,pf:0,pa:0}).sec+=dt}})}last=Math.max(last,t1)};

    const isFT=/^Free Throw/.test(ty);
    if(p.shot&&a&&box[a]&&!/Heave/.test(ty)){
      const t=teamOf(a);
      if(isFT){box[a].fta++;tm[t].fta++;if(p.sc){box[a].ftm++;tm[t].ftm++}}
      else{const three=p.pa===3;box[a].fga++;tm[t].fga++;if(three){box[a].tpa++;tm[t].tpa++}
        if(p.sc){box[a].fgm++;tm[t].fgm++;if(three){box[a].tpm++;tm[t].tpm++}
          if(b&&/assists/.test(p.text)&&box[b]){box[b].ast++;tm[t].ast++;asts.push([t,b,a])}}
        else if(b&&/blocks/.test(p.text)&&box[b]){box[b].blk++;tm[teamOf(b)].blk++}
        if(p.x!=null)shots.push({t,id:a,x:p.x,y:p.y,m:!!p.sc,three,per:p.per,clock:p.clock,text:p.text})}
    }
    if(/Foul/.test(ty)&&!/Offensive|Technical/.test(ty)){snap={t:p.t,per:p.per,on:{}};tid.forEach(x=>snap.on[x]=new Set(on[x]))}
    if(p.sc&&p.val>0){const t=p.team&&tm[p.team]?p.team:teamOf(a);if(t){if(a&&box[a])box[a].pts+=p.val;
      const o=tid.find(x=>x!==t);const useSnap=isFT&&!/Technical/.test(ty)&&snap&&snap.t===p.t&&snap.per===p.per;const ON=useSnap?snap.on:on;
      ON[t].forEach(id=>box[id].pm+=p.val);ON[o].forEach(id=>box[id].pm-=p.val);
      const kt=[...ON[t]].sort().join(','),ko=[...ON[o]].sort().join(',');if(lu[t][kt])lu[t][kt].pf+=p.val;else if(ON[t].size)lu[t][kt]={ids:[...ON[t]],sec:0,pf:p.val,pa:0};

    else if(/Rebound/.test(ty)&&p.team&&tm[p.team]){tm[p.team][/Offensive/.test(ty)?'oreb':'dreb']++}
    if(/Turnover|^Traveling|Double Dribble|Discontinued? Dribble|Offensive Goaltending|Palming|Backcourt|3-Second Violation$|Inbound/.test(ty)&&!/Kicked|Defensive/.test(ty)){const t=p.team||teamOf(a);if(tm[t])tm[t].to++;if(a&&box[a]&&teamOf(a)===t)box[a].to++;if(b&&/steals/.test(p.text)&&box[b]){box[b].stl++;tm[teamOf(b)].stl++}}
    else if(/Foul/.test(ty)&&!/Technical|Flagrant Type|Double Technical/.test(ty)&&a&&box[a]){box[a].pf++;tm[teamOf(a)].pf++}
    if(p.sc){const m=(D.focus.ha==='home'?p.hs-p.as:p.as-p.hs);margin.push([p.t,m]);
      const sg=Math.sign(m);if(sg===0&&prevSign!==0)ties++;if(sg!==0&&prevSign!==0&&sg!==prevSign)lc++;if(sg!==0)prevSign=sg;
      if(m>lead[D.focus.id])lead[D.focus.id]=m;if(-m>lead[D.other.id])lead[D.other.id]=-m}
  });

  const hs=lp?lp.hs:0,as=lp?lp.as:0;
  tid.forEach(t=>tm[t].pts=t===D.home.id?hs:as);

  if(run&&run.pts>=8)runs.push(Object.assign(run,{open:true}));

  return {plays,box,tm,lu,on,margin,runs,shots,asts,hs,as,lp,lead,lc,ties,wp:wpv,elapsed:lp?lp.t:0};
}

/* Shots */
const ZONES=[['Rim','0–4 ft'],['Paint','4–14 ft'],['Midrange','14 ft to the arc'],['Corner 3',''],['Above-the-break 3','']];
function zoneOf(s){const d=Math.hypot(s.x-25,s.y);if(s.three)return s.y<=9?3:4;if(d<4)return 0;if(d<14)return 1;return 2}
function vShots(v,D,R){
  if(!S.f.shotTeam)S.f.shotTeam=D.focus.id;

  const fl=el('div','fl');D.teams.slice().sort((a,b)=>(b===D.focus)-(a===D.focus)).forEach(t=>{const b=el('button',null,t.abbr);b.type='button';b.setAttribute('aria-pressed',S.f.shotTeam===t.id);b.onclick=()=>{S.f.shotTeam=t.id;S.f.shotPl='all';renderView(D,S.R)};fl.appendChild(b)});

  <g fill="none" stroke="#b9b2a6" stroke-width=".25"><rect x="17" y="${47-19}" width="16" height="19"/><circle cx="25" cy="${47-19}" r="6"/><line x1="3" y1="47" x2="3" y2="${47-14}"/><line x1="47" y1="47" x2="47" y2="${47-14}"/>
  <path d="M3 ${47-14} A23.75 23.75 0 0 1 47 ${47-14}"/><circle cx="25" cy="${Y(0)}" r=".75"/><line x1="22" y1="${47-4}" x2="28" y2="${47-4}"/><path d="M21 ${Y(0)} A4 4 0 0 1 29 ${Y(0)}"/></g>`;

  s+='</svg>';cw.innerHTML=s;
  const k=el('div','key');k.innerHTML=`<span><i style="background:${col};border-radius:50%"></i>Made</span><span>× Missed</span><span>${sh.filter(q=>q.m).length}-${sh.length} from the field</span>`;cw.appendChild(k);
  const zc=el('div');zc.appendChild(el('h3',null,'By zone'));const zt=el('table','zt');const hr=el('tr');['Zone','FG','%','Share'].forEach(h=>hr.appendChild(el('th',null,h)));zt.appendChild(hr);
  const Z=ZONES.map(()=>[0,0]);sh.forEach(q=>{const z=zoneOf(q);Z[z][1]++;if(q.m)Z[z][0]++});
  Z.forEach(([m,a],i)=>{const tr=el('tr');const n=el('td');n.append(ZONES[i][0]);if(ZONES[i][1]){n.appendChild(el('span','pos',ZONES[i][1]))}
    const sh2=el('td');const share=sh.length?a/sh.length:0;const bar=el('span','zbar');bar.style.width=Math.round(share*60)+'px';bar.style.background=col;sh2.append(bar,' '+Math.round(share*100)+'%');
    tr.append(n,el('td',null,m+'-'+a),el('td',null,a?Math.round(m/a*100)+'%':'–'),sh2);zt.appendChild(tr)});

const fmtMin=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
/* Assists */
function vAssists(v,D,R){
  if(!S.f.astTeam)S.f.astTeam=D.focus.id;
  const c=el('div','card net');c.appendChild(el('h2',null,'Assist network'));
  const fl=el('div','fl');D.teams.slice().sort((a,b)=>(b===D.focus)-(a===D.focus)).forEach(t=>{const b=el('button',null,t.abbr);b.type='button';b.setAttribute('aria-pressed',S.f.astTeam===t.id);b.onclick=()=>{S.f.astTeam=t.id;renderView(D,S.R)};fl.appendChild(b)});c.appendChild(fl);
  const A=R.asts.filter(a=>a[0]===S.f.astTeam);
  if(!A.length){c.appendChild(el('p','empty','No assists yet.'));v.appendChild(c);return}
  const pairs={},inv={};A.forEach(([t,p,s])=>{const k=p+'>'+s;pairs[k]=(pairs[k]||0)+1;inv[p]=inv[p]||{a:0,r:0};inv[s]=inv[s]||{a:0,r:0};inv[p].a++;inv[s].r++});
  const ids=Object.keys(inv).sort((a,b)=>(inv[b].a+inv[b].r)-(inv[a].a+inv[a].r));
  const W=440,H=360,cx=W/2,cy=H/2,rad=130;const pos={};ids.forEach((id,i)=>{const a=-Math.PI/2+i*2*Math.PI/ids.length;pos[id]=[cx+rad*Math.cos(a),cy+rad*Math.sin(a)]});
  const col=S.f.astTeam===D.focus.id?'#860038':'#4a5360';
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Assist network"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker></defs>`;
  const mxp=Math.max(...Object.values(pairs));
  Object.entries(pairs).forEach(([k,n])=>{const[p,q]=k.split('>');const[a1,b1]=pos[p],[a2,b2]=pos[q];const dx=a2-a1,dy=b2-b1,L=Math.hypot(dx,dy);const r2=12;
    const mx=(a1+a2)/2-dy*0.12,my=(b1+b2)/2+dx*0.12;const ex=a2-dx/L*r2,ey=b2-dy/L*r2;
    s+=`<path d="M${a1},${b1} Q${mx},${my} ${ex},${ey}" fill="none" stroke="${col}" stroke-opacity="${.25+.6*n/mxp}" stroke-width="${1+3*n/mxp}" marker-end="url(#ah)"><title>${esc(D.P[p].name)} to ${esc(D.P[q].name)}: ${n}</title></path>`});
  ids.forEach(id=>{const[x,y]=pos[id];const r=6+Math.sqrt(inv[id].a)*3;const lx=x+(x-cx)/rad*(r+8),ly=y+(y-cy)/rad*(r+8);
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${col}" stroke-width="2"/><text x="${lx}" y="${ly+4}" text-anchor="${x<cx-5?'end':x>cx+5?'start':'middle'}" font-size="12" font-family="var(--sans)" font-weight="600" fill="var(--fg)">${esc(D.P[id].last)}</text>`});
  s+='</svg>';c.insertAdjacentHTML('beforeend',s);

  c.appendChild(el('h3',null,'Who set up whom'));const ul=el('ul','al');

  c.appendChild(ul);v.appendChild(c);
}
