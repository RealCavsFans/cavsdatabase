name: Live page game archive
on:
  schedule:
    - cron: '*/30 0-6 * * *'   # every 30 minutes, 8 p.m.–2:30 a.m. Eastern, so finished games land soon after the buzzer
    - cron: '40 14 * * *'      # daytime catch-up
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to archive (default 2026-27)'
        required: false
        default: '2026-27'
permissions:
  contents: write
concurrency:
  group: live-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      # Gate: on scheduled runs, stop in a couple of seconds unless a Cavs game finished in the last 36 hours.
      - name: Any Cavs game to archive?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          # Nov 8: the daily catch-up always runs, so a correction the NBA makes days after a game reaches the saved game and the season totals
          if [ "${{ github.event.schedule }}" = "40 14 * * *" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          Y=$(date -u +%Y); M=$(date -u +%m); [ "$M" -ge 8 ] && Y=$((Y+1))
          N=$(curl -s -m 20 "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/5/schedule?season=$Y" | jq --arg c "$(date -u -d '36 hours ago' +%Y-%m-%dT%H:%MZ)" '[.events[]? | select(.competitions[0].status.type.completed and .date >= $c)] | length' 2>/dev/null || echo 1)
          echo "recent finals: $N"; [ "${N:-1}" -gt 0 ] && echo "go=1" >> $GITHUB_OUTPUT || true
      # Only the files this job needs (not the whole site, images or history).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        if: steps.gate.outputs.go == '1'
        with:
          sparse-checkout: |
            scripts/live-archive.mjs
            scripts/box-check.mjs
            scripts/nba-store.mjs
            scripts/nba-fixes.mjs
            pdata/nba-fixes.json
            scripts/last-time.mjs
            data/hist-cle.json
            data/last-time.json
            live-core.js
            live-archive
            cavs.ics
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22
      # Nov 2: the NBA's own files first. The saved NBA games (nba-data branch), plus any Cavs final it doesn't have yet,
      # fetched straight from the NBA here (not saved back; the NBA game store job does that). If any of this fails, ESPN as before.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        with:
          ref: nba-data
          path: nba-data
          sparse-checkout: |
            ${{ github.event.inputs.season || '2026-27' }}
            fixes.json
      - run: |
          node scripts/nba-store.mjs nba-data || { echo "::warning::NBA feed unavailable; using ESPN"; [ -n "$NTFY_TOPIC" ] && curl -s -m 15 -H "Title: NBA feed down, game archive used ESPN" -H "Tags: warning" -d "The NBA's files didn't answer, so tonight's Cavs game was saved from ESPN. It switches back on its own." "https://ntfy.sh/$NTFY_TOPIC"; true; }
        if: steps.gate.outputs.go == '1' && (github.event.inputs.season || '2026-27') == '2026-27'
        continue-on-error: true
        env:
          SEASON: ${{ github.event.inputs.season || '2026-27' }}
          TEAM: CLE
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: node scripts/live-archive.mjs
        if: steps.gate.outputs.go == '1'
        env:
          SEASON: ${{ github.event.inputs.season || '2026-27' }}
      # Nov 7: the newly saved games against the official box score and line score; a push if anything is off
      - name: Check against the official box score
        if: steps.gate.outputs.go == '1'
        env:
          SEASON: ${{ github.event.inputs.season || '2026-27' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e; node scripts/box-check.mjs; code=$?; set -e
          if [ "$code" = "2" ] && [ -n "$NTFY_TOPIC" ]; then curl -s -m 15 -H "Title: Saved game doesn't match the box score" -H "Tags: warning" --data-binary @data/box-check-alert.txt "https://ntfy.sh/$NTFY_TOPIC" || true; fi
          rm -f data/box-check.json data/box-check-alert.txt; true
      # "Last time this happened" notes for the game page (rare numbers vs every Cavs game since 2000-01)
      - run: node scripts/last-time.mjs || true
        if: steps.gate.outputs.go == '1' && (github.event.inputs.season || '2026-27') == '2026-27'
      - name: Commit if changed
        if: steps.gate.outputs.go == '1'
        run: |
          [ -d live-archive ] || exit 0
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add live-archive; [ -f data/last-time.json ] && git add data/last-time.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update live game archive"
          for i in 1 2 3 4 5 6; do   # Nov 1: six tries with a random wait, so two jobs saving at once both get through
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            # a hand edit to the same generated files (season.json, p/*.json) makes the rebase conflict every time:
            # keep this run's game files, take the latest main, and rebuild the season files from them (Oct 30 audit)
            rm -rf /tmp/la && cp -r live-archive /tmp/la
            git fetch origin main && git reset --hard origin/main
            cp -r /tmp/la/. live-archive/
            SKIP_FETCH=1 node scripts/live-archive.mjs || true
            git add live-archive; [ -f data/last-time.json ] && git add data/last-time.json || true
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update live game archive"; sleep $((RANDOM % 20 + i * 10))
          done
          exit 1
      # Nov 3: a push to Luka's phone (ntfy app, private channel in the NTFY_TOPIC secret) when this job fails
      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -s -m 15 -H "Title: cavsdatabase: ${{ github.workflow }} failed" -H "Priority: high" -H "Tags: warning" -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -d "The job stopped with an error. Tap to open the run on GitHub." "https://ntfy.sh/$NTFY_TOPIC" || true
