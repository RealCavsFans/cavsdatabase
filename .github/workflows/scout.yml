name: Scouting report for the next opponent
on:
  # Backup only (Nov 1): the morning job (morning.yml, 6:45 a.m.) builds the report. These runs check whether it already
  # covers the next opponent and their latest game, and rebuild only if a source was late. Important on back-to-backs.
  schedule:
    - cron: '35 15 * * *'   # 11:35 a.m. Eastern
    - cron: '35 18 * * *'   # 2:35 p.m. Eastern
    - cron: '5 21 * * *'    # 5:05 p.m. Eastern, still ahead of a 7 p.m. tip
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          sparse-checkout: |
            scripts/scout.mjs
            scripts/nba-fixes.mjs
            pdata/nba-fixes.json
            live-core.js
            live-base.json
            pdata/scout.json
            data/scout-cache.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      # Nov 3: the NBA's own box scores and play-by-play (nba-data branch, this season) for the scouting report
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        continue-on-error: true
        with:
          ref: nba-data
          path: nba-data
          sparse-checkout: |
            2026-27
            fixes.json
      - run: node scripts/scout.mjs
        env:
          ONLY_IF_STALE: ${{ github.event_name == 'schedule' && '1' || '' }}
      - name: Commit if changed
        run: |
          [ -f pdata/scout.json ] || exit 0
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add pdata/scout.json
          [ -f data/scout-cache.json ] && git add data/scout-cache.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update scouting report"
          for i in 1 2 3 4 5 6; do   # Nov 1: six tries with a random wait, so two jobs saving at once both get through
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 20 + i * 10))
          done
          exit 1
