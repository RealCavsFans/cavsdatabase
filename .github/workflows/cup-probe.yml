name: NBA Cup standings (run by hand)
# Nov 9: runs scripts/nba-cup.mjs on its own and shows the result; the page build runs it every 30 minutes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - run: FORCE=1 node scripts/nba-cup.mjs && node -e "const j=require('./pdata/nba-cup.json');console.log(j.source);for(const [g,r] of Object.entries(j.groups))console.log(g,r.map(x=>x.t+' '+x.w+'-'+x.l+' '+(x.pd>=0?'+':'')+x.pd).join(' | '));console.log('wild',JSON.stringify(j.wildcard))"
      - name: ESPN backup on its own
        run: node -e "process.env.FORCE=1" ; sed -i 's/let src = .NBA.com schedule., games = await fromNBA();/let src = "x", games = null;/' scripts/nba-cup.mjs && DEBUG=1 FORCE=1 node scripts/nba-cup.mjs; node -e "const j=require('./pdata/nba-cup.json');console.log(j.source,JSON.stringify(j.cle))"
