name: Test phone alert
# Nov 3: sends one test push to Luka's phone (ntfy, private channel in the NTFY_TOPIC secret). Run it by hand from the Actions tab.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "::error::NTFY_TOPIC secret is not set"; exit 1; fi
          curl -s -m 15 -H "Title: cavsdatabase alerts are on" -H "Tags: basketball" -d "This is a test. You'll get a push like this when a site job fails or the morning health check finds a problem." "https://ntfy.sh/$NTFY_TOPIC"
