name: Site health check
# Runs scripts/health.mjs every morning without Claude. If something is stale or broken it opens a GitHub issue
# titled "Site health" (GitHub emails the repo owner); later problems add a comment; it closes the issue once healthy again.
on:
  schedule:
    - cron: '15 9 * * *'   # 5:15 a.m. Eastern (4:15 in winter), so the 5:48 a.m. daily update task can read the result
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          fetch-depth: 200
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - name: Check
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # check 11 counts this month's site builds from GitHub's push history
        run: |
          set +e
          git fetch -q --depth=1 origin +refs/heads/deploy:refs/remotes/origin/deploy   # the built site, for check 9
          node scripts/health.mjs > /tmp/health.txt 2>&1; c1=$?
          # live-site comparison (scripts/site-check.mjs) removed Oct 29: Cloudflare's Bot Fight Mode blocks GitHub's servers from the site
          echo "code=$c1" >> "$GITHUB_OUTPUT"
          cat /tmp/health.txt
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          N=$(gh issue list --state open --search 'in:title "Site health"' --json number -q '.[0].number')
          if [ "${{ steps.chk.outputs.code }}" != "0" ]; then
            { echo "The daily health check found a problem on $(TZ=America/New_York date '+%b %-d, %Y'):"; echo; echo '```'; cat /tmp/health.txt; echo '```'; echo; echo "See MANUAL.md for what to do, or ask Claude to look."; } > /tmp/body.md
            if [ -n "$N" ]; then gh issue comment "$N" --body-file /tmp/body.md; else gh issue create --title "Site health: something needs attention" --body-file /tmp/body.md; fi
            if [ -n "$NTFY_TOPIC" ]; then grep -A3 '^PROBLEMS' /tmp/health.txt | tail -n +2 | head -3 | curl -s -m 15 -H "Title: cavsdatabase health check found a problem" -H "Tags: warning" -H "Click: ${{ github.server_url }}/${{ github.repository }}/issues" --data-binary @- "https://ntfy.sh/$NTFY_TOPIC" || true; fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "Healthy again as of $(TZ=America/New_York date '+%b %-d, %Y')."
          fi
      # Nov 3: a push to Luka's phone (ntfy app, private channel in the NTFY_TOPIC secret) when this job fails
      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -s -m 15 -H "Title: cavsdatabase: ${{ github.workflow }} failed" -H "Priority: high" -H "Tags: warning" -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -d "The job stopped with an error. Tap to open the run on GitHub." "https://ntfy.sh/$NTFY_TOPIC" || true
