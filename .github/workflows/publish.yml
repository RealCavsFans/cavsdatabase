name: Publish data updates to the site
# Nov 1: Cloudflare serves the 'deploy' branch, which the page build (videos.yml) replaces about every 30 minutes.
# This puts other updates on the site within a minute or two: hand edits and the daily task's pushes to main, and the
# data the other jobs save. It takes the latest main plus the pages already built on 'deploy' (no rebuild) and only
# publishes when something actually changed. Saves made by the jobs themselves don't start workflows, hence workflow_run.
on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Live page game archive
      - Morning data (baselines, scouting, BBR ids, injuries)
      - League games missed to injury
      - Official NBA injury report
      - Scouting report for the next opponent
      - Game-high history
      - Cavs & Coffee newsletter
      - Push alerts (OneSignal)
      - Weekly link check
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true   # the newest run always publishes the newest main, so an older queued one isn't needed
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      # Nov 3: Cloudflare builds one version at a time and skips a build when a newer push lands first. On busy days the jobs
      # published every minute or two, so builds kept getting skipped and the live site fell an hour behind. Wait 3 minutes
      # first: a newer publish cancels this one (cancel-in-progress), so a burst of saves becomes one push to 'deploy'.
      - name: Let a burst of saves settle
        if: github.event_name != 'workflow_dispatch'
        run: sleep 180
      # Nov 3: locked test games and bad-data drills for the NBA-feed build; a failure stops the publish so the site keeps the last good version
      - run: node scripts/regress.mjs
      - run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          node scripts/publish-deploy.mjs
      # Nov 3: a push to Luka's phone (ntfy app, private channel in the NTFY_TOPIC secret) when this job fails
      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -s -m 15 -H "Title: cavsdatabase: ${{ github.workflow }} failed" -H "Priority: high" -H "Tags: warning" -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -d "The job stopped with an error. Tap to open the run on GitHub." "https://ntfy.sh/$NTFY_TOPIC" || true
