name: Advanced stats audit (Basketball Reference)
# Nov 15 (Luka): run by hand. Saves Basketball Reference's Cavs Advanced tables (data/bbr-adv.json) so the season page's
# advanced numbers can be compared with them.
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Season end years, comma separated'
        default: '2026,2027'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          sparse-checkout: |
            scripts/bbr-adv-audit.mjs
            data
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - run: node scripts/bbr-adv-audit.mjs
        env:
          YEARS: ${{ inputs.years }}
      - name: Commit if changed
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add data/bbr-adv.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Advanced stats audit: Basketball Reference tables"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 20 + i * 10))
          done
          exit 1
