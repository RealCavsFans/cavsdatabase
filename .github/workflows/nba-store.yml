name: NBA game store
# Keeps the NBA's own box score and play-by-play for every finished game on the 'nba-data' branch (scripts/nba-store.mjs).
# The game archive and the league-wide numbers are built from it. Runs after each night's games and again in the morning.
on:
  schedule:
    - cron: '20 5 * * *'    # 1:20 a.m. Eastern, after the late games
    - cron: '50 10 * * *'   # 6:50 a.m. Eastern, corrections and anything late
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (default: current). A past season walks every game id once.'
        required: false
        default: ''
      team:
        description: 'Only this team (e.g. CLE), for a quick backfill'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: nba-store
  cancel-in-progress: false
jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          sparse-checkout: |
            scripts/nba-store.mjs
            scripts/nba-check.mjs
            scripts/nba-fixes.mjs
            scripts/nba-fixfind.mjs
            pdata/nba-fixes.json
            live-core.js
            live-archive
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          ref: nba-data
          path: nba-data
      - run: node scripts/nba-store.mjs nba-data
        env:
          SEASON: ${{ github.event.inputs.season }}
          TEAM: ${{ github.event.inputs.team }}
      # Nov 3: the NBA sometimes names the wrong player in a substitution; find the one correction that makes every player's
      # minutes match the NBA box score (last 7 days, or the whole season when one is given) and save it with the games
      - run: node scripts/nba-fixfind.mjs nba-data ${{ github.event.inputs.season && format('--season {0}', github.event.inputs.season) || '--days 7' }} || echo "::warning::fix finder did not finish"
        continue-on-error: true
      # every stored game held to rules that are always true (scripts/nba-check.mjs); the report is saved with the games
      - run: node scripts/nba-check.mjs nba-data || echo "::warning::check did not finish"
        continue-on-error: true
        env:
          SEASON: ${{ github.event.inputs.season }}
      - name: Save
        run: |
          cd nba-data; git config user.name "cavsdatabase-bot"; git config user.email "bot@cavsdatabase.com"; git add -A
          if git diff --cached --quiet; then echo "no new games"; exit 0; fi
          git commit -q -m "NBA games $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git push -q origin HEAD:nba-data && exit 0; sleep $((i * 15)); git pull -q --rebase origin nba-data || git rebase --abort; done
          exit 1
