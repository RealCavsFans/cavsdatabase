name: Name pronunciations
# Nov 8 (Luka): once a day, pick up the players' own name recordings and the written respellings from the NBA's
# newest pronunciation guide as soon as it's posted (scripts/pron-update.mjs). Commits index.html only when something new appears.
on:
  schedule:
    - cron: '35 13 * * *'   # 8:35 a.m. Eastern
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pron
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          sparse-checkout: |
            index.html
            scripts/pron-update.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - run: PROBE=1 node scripts/pron-update.mjs   # last season's Mitchell clip must be found, or the lookup itself is broken
      - run: node scripts/pron-update.mjs
      - name: Commit if changed
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Name pronunciations from the NBA's newest guide"
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 15 + i * 10)); done
          exit 1
      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -s -m 15 -H "Title: cavsdatabase: ${{ github.workflow }} failed" -H "Tags: warning" -d "The pronunciation update stopped with an error." "https://ntfy.sh/$NTFY_TOPIC" || true
