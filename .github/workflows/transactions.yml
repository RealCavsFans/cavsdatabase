name: Update transactions
on:
  schedule:
    - cron: '17 10 * * *'   # daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transactions
  cancel-in-progress: false
jobs:
  transactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-transactions.mjs
      - name: Commit if changed
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update transactions"
          git pull --rebase origin main
          git push
