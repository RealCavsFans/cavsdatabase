name: Live page season baselines
on:
  # daily run moved into morning.yml (Oct 27); this one is for running by hand (any season)
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to fetch (default 2026-27)'
        required: false
        default: '2026-27'
permissions:
  contents: write
concurrency:
  group: live-base
  cancel-in-progress: false
jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          sparse-checkout: |
            scripts/fetch-live-base.mjs
            live-base.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - run: node scripts/fetch-live-base.mjs
        env:
          SEASON: ${{ github.event.inputs.season || '2026-27' }}
      - name: Commit if changed
        run: |
          [ -f live-base.json ] || exit 0
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add live-base.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update live page baselines"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 20
          done
          exit 1
