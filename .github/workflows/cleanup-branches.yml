name: Delete old mockup branches
on:
  # run by hand: deletes mockup and probe branches (mock-*, probe-*) and finished experiments; main and deploy stay
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          fetch-depth: 1
      - run: |
          for b in $(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | grep -E '^(mock-|probe-injury|probe-draft$|css-cleanup$|speed-1$)'); do
            git push origin --delete "$b" && echo "deleted $b"
          done
