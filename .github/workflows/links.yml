name: Weekly link check
on:
  schedule:
    - cron: '23 10 * * 1'   # Mondays, early morning ET
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: links
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - run: node scripts/links.mjs
      - name: Save the result
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add links-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Weekly link check"
          for i in 1 2 3; do git pull --rebase -q -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
