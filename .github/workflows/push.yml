name: Push alerts (OneSignal)
on:
  # paused Oct 29 (Luka's call). To turn back on, uncomment these schedule lines.
  # schedule:
  #   - cron: '*/10 * * * *'   # tip-off, final score, and the once a day transactions/injuries alert
  #   - cron: '*/5 23,0-4 * * *'   # every 5 minutes in the evening, for end-of-quarter and big-run alerts
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: push
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - name: Send any due alerts (dry run unless PUSH_LIVE is "true")
        run: node scripts/push.mjs
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          PUSH_LIVE: ${{ vars.PUSH_LIVE }}
      - name: Remember what went out
        if: always()
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add data/push-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Push alerts state"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*10)); done
          exit 1
