name: Update videos, box scores and news
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, so postgame pressers show up quickly
  workflow_dispatch:
  # rebuild the page copies right after an edit to the site's source, so changes show up in minutes.
  # This job is the only thing that builds pages; every other job and hand edit commits index.html alone.
  push:
    branches: [main]
    paths: ['index.html', 'live.src.html', 'live-core.js', 'pdata/history.json', 'scripts/build-pages.mjs', 'scripts/build-live.mjs', 'scripts/prerender.mjs', 'scripts/og-live.mjs']
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-videos.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: node scripts/fetch-boxscores.mjs
      - run: node scripts/fetch-league.mjs
        continue-on-error: true
      - run: node scripts/fetch-rcf.mjs
      - run: node scripts/fetch-news.mjs
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: node scripts/fetch-niang.mjs
      - run: node scripts/fetch-headshots.mjs
      - name: Install headless Chrome driver (for prerendering page copies)
        run: npm i --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.0 esbuild@0.24.0
      - run: node scripts/og-games.mjs
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/og-live.mjs
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/og-seasons.mjs
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/build-pages.mjs --prerender
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Safety check (stops the commit if a page breaks)
        run: node scripts/smoke.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Commit if changed
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          add(){ git add videos.json box.json rcf.json; [ -f news.json ] && git add news.json || true; [ -f news-status.txt ] && git add news-status.txt || true; [ -f niang.json ] && git add niang.json || true; [ -f pdata/niang-games.json ] && git add pdata/niang-games.json || true; git add *.html sitemap.xml; [ -d embed ] && git add embed || true; [ -d games ] && git add games || true; [ -f cavs.ics ] && git add cavs.ics || true; git add -A data/prerender-hash.txt 2>/dev/null || true; [ -d img ] && git add img || true; [ -d og/g ] && git add og/g || true; [ -d og/h ] && git add og/h || true; [ -d og/p ] && git add og/p || true; [ -d og/gp ] && git add -A og/gp || true; [ -f og/live.json ] && git add og/live.json og/cap.jpg og/schedule.jpg og/assets.jpg og/moves.jpg || true; [ -f og/history.jpg ] && git add og/history.jpg || true; [ -d a ] && git add -A a || true; [ -d players ] && git add players || true; [ -d history ] && git add history || true; [ -d media ] && git add media || true; [ -f box-status.txt ] && git add box-status.txt || true; [ -f pdata/league.json ] && git add pdata/league.json pdata/milestones.json || true; }
          # after a push that changed the pages, tell Bing/Yandex/others (IndexNow) to recrawl
          ping(){ if git diff --name-only HEAD~1 HEAD | grep -q prerender-hash; then
            K=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//'); [ -n "$K" ] || return 0
            curl -s -o /dev/null -w "IndexNow %{http_code}\n" -H 'Content-Type: application/json' https://api.indexnow.org/indexnow \
              -d "{\"host\":\"cavsdatabase.com\",\"key\":\"$K\",\"keyLocation\":\"https://cavsdatabase.com/$K.txt\",\"urlList\":[\"https://cavsdatabase.com/\",\"https://cavsdatabase.com/schedule\",\"https://cavsdatabase.com/roster-tree\",\"https://cavsdatabase.com/roster\",\"https://cavsdatabase.com/staff\",\"https://cavsdatabase.com/cap\",\"https://cavsdatabase.com/assets\",\"https://cavsdatabase.com/moves\",\"https://cavsdatabase.com/charge\",\"https://cavsdatabase.com/media\",\"https://cavsdatabase.com/resources\"]}" || true; fi; }
          add
          if git diff --cached --quiet; then exit 0; fi
          # scheduled runs: skip commits that are only timestamps and rebuilt page copies (scripts/changed.mjs)
          if [ "${{ github.event_name }}" = "schedule" ] && ! node scripts/changed.mjs; then exit 0; fi
          git commit -m "Update videos"
          # main can move while this runs (site edits, the daily data task). If the rebase or push
          # fails, keep this run's fresh data files, rebuild the page copies on top of the latest main and retry.
          for i in 1 2 3; do
            git stash 2>/dev/null || true
            if git pull --rebase origin main && git push; then sleep 60; ping; exit 0; fi
            git rebase --abort 2>/dev/null || true
            mkdir -p /tmp/keep && cp -r videos.json box.json rcf.json niang.json /tmp/keep/ 2>/dev/null || true; mkdir -p /tmp/keep/pdata && cp pdata/league.json pdata/niang-games.json /tmp/keep/pdata/ 2>/dev/null || true
            [ -d img ] && cp -r img /tmp/keep/ || true
            git fetch origin main && git reset --hard origin/main
            cp -r /tmp/keep/. . 2>/dev/null || true
            CHROME_PATH=/usr/bin/google-chrome node scripts/build-pages.mjs --prerender
            add
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update videos"
            sleep $((i*10))
          done
          exit 1
