name: Update videos, box scores and news
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, so postgame pressers show up quickly
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-videos.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: node scripts/fetch-boxscores.mjs
      - run: node scripts/fetch-rcf.mjs
      - run: node scripts/fetch-headshots.mjs
      - run: node scripts/build-pages.mjs
      - name: Commit if changed
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          add(){ git add videos.json box.json rcf.json *.html media/*.html; [ -d img ] && git add img || true; [ -f box-status.txt ] && git add box-status.txt || true; }
          add
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update videos"
          # main can move while this runs (site edits, the daily data task). If the rebase or push
          # fails, keep this run's fresh data files, rebuild the page copies on top of the latest main and retry.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            mkdir -p /tmp/keep && cp -r videos.json box.json rcf.json /tmp/keep/ 2>/dev/null || true
            [ -d img ] && cp -r img /tmp/keep/ || true
            git fetch origin main && git reset --hard origin/main
            cp -r /tmp/keep/. . 2>/dev/null || true
            node scripts/build-pages.mjs
            add
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update videos"
            sleep $((i*10))
          done
          exit 1
