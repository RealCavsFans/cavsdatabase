name: Update videos, box scores and news
on:
  schedule:
    - cron: '*/30 0-6,11-23 * * *'   # every 30 minutes from about 7 a.m. to 3 a.m. Eastern, so postgame pressers show up quickly
    - cron: '0 7-10 * * *'             # hourly in the quiet overnight hours (Oct 30 audit: halves the overnight runs)
  workflow_dispatch:
  # rebuild the page copies right after an edit to the site's source, so changes show up in minutes.
  # This job is the only thing that builds pages; every other job and hand edit commits index.html alone.
  push:
    branches: [main]
    paths: ['index.html', 'live.src.html', 'live-core.js', 'pdata/history.json', 'scripts/build-pages.mjs', 'scripts/build-live.mjs', 'scripts/prerender.mjs', 'scripts/og-live.mjs']
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # Nov 9: normal runs take 1-7 minutes
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      # Nov 1: main no longer stores the built pages or share images; bring back the last build from 'deploy' so the
      # image scripts only draw what's new and the page build can skip when nothing changed
      - name: Restore the last build
        run: |
          node scripts/publish-deploy.mjs --restore
          echo "H0=$(head -1 data/prerender-hash.txt 2>/dev/null)" >> "$GITHUB_ENV"
      - run: node scripts/fetch-videos.mjs
        if: github.event_name != 'push'   # a source edit only needs the pages rebuilt; the scheduled runs fetch the data
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: node scripts/fetch-boxscores.mjs
        if: github.event_name != 'push'
      # Nov 3: the NBA's own box scores and play-by-play (nba-data branch, this season only) for the league team lines and shots
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        if: github.event_name != 'push'
        continue-on-error: true
        with:
          ref: nba-data
          path: nba-data
          sparse-checkout: |
            2026-27
            fixes.json
      - run: node scripts/fetch-league.mjs
        if: github.event_name != 'push'
        continue-on-error: true
      # team numbers (standings, ratings, four factors, scores) from the box scores fetch-league just saved.
      # Moved here from the old team-stats job (Oct 30) so the same data isn't read twice. The pbpstats backup only runs twice a day.
      - name: Team stats
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          case "$(date -u +%H)" in 05|09) node scripts/backup-pbpstats.mjs || true;; esac
          node scripts/team-stats.mjs
          node scripts/cle-rates.mjs
          node scripts/sos.mjs || true
      - run: node scripts/fetch-rcf.mjs
        if: github.event_name != 'push'
      # RealCavsFans YouTube uploads for the Media page only (Oct 31). Writes rcf-videos.json only when the list changes.
      - run: node scripts/fetch-rcf-videos.mjs
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: node scripts/fetch-news.mjs
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: node scripts/fetch-niang.mjs
        if: github.event_name != 'push'
      - run: node scripts/fetch-headshots.mjs
        if: github.event_name != 'push'
      - name: Install headless Chrome driver (for prerendering page copies)
        run: npm i --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.0 esbuild@0.24.0
      - run: node scripts/og-games.mjs
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/og-live.mjs
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/og-seasons.mjs
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/build-pages.mjs --prerender
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: NBA-feed build check (locked test games and bad-data drills)
        run: node scripts/regress.mjs
      - name: Safety check (stops the commit if a page breaks)
        # Nov 9: a hung browser here stalled the job for 45 minutes until GitHub dropped the runner; normally ~30 seconds.
        # One retry after a timeout, so a stuck Chrome doesn't block the next build.
        timeout-minutes: 6
        run: timeout 150 node scripts/smoke.mjs || { echo "::warning::smoke check hung or failed once; retrying"; timeout 150 node scripts/smoke.mjs; }
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Commit if changed
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          # data only: the built pages and share images go to the 'deploy' branch (next step), not main
          add(){ git add videos.json box.json rcf.json; for f in rcf-videos.json pdata/sos.json data/league-schedule.json data/rcf-first.json news.json news-status.txt niang.json pdata/niang-games.json cavs.ics box-status.txt pdata/league.json pdata/milestones.json pdata/league-shots.json pdata/cle-rates.json; do [ -f "$f" ] && git add "$f"; done; [ -d img ] && git add img; git add index.html; true; }
          add
          if git diff --cached --quiet; then exit 0; fi
          # scheduled runs: skip commits that are only timestamps and rebuilt page copies (scripts/changed.mjs)
          if [ "${{ github.event_name }}" = "schedule" ] && ! node scripts/changed.mjs; then exit 0; fi
          git commit -m "Update videos"
          # main can move while this runs (site edits, the daily data task). If the rebase or push
          # fails, keep this run's fresh data files, rebuild the page copies on top of the latest main and retry.
          for i in 1 2 3 4 5 6; do   # Nov 1: six tries with a random wait, so two jobs saving at once both get through
            git stash 2>/dev/null || true
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            mkdir -p /tmp/keep && cp -r videos.json box.json rcf.json rcf-videos.json niang.json /tmp/keep/ 2>/dev/null || true; mkdir -p /tmp/keep/pdata && cp pdata/league.json pdata/niang-games.json pdata/league-shots.json pdata/sos.json /tmp/keep/pdata/ 2>/dev/null || true
            [ -d img ] && cp -r img /tmp/keep/ || true
            git fetch origin main && git reset --hard origin/main
            cp -r /tmp/keep/. . 2>/dev/null || true
            node scripts/team-stats.mjs || true; node scripts/cle-rates.mjs || true
            CHROME_PATH=/usr/bin/google-chrome node scripts/build-pages.mjs --prerender
            add
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update videos"
            sleep $((RANDOM % 15 + i * 10))
          done
          exit 1
      # Nov 1: Cloudflare serves the 'deploy' branch: latest main plus this run's built pages, as one commit that replaces
      # the branch each time (scripts/publish-deploy.mjs), so old builds never pile up in the repo's history
      - name: Publish the built site to the deploy branch
        if: success()
        run: node scripts/publish-deploy.mjs --from-worktree
      # when the pages were rebuilt, tell Bing/Yandex/others (IndexNow) to recrawl
      - name: Ask search engines to recrawl
        if: success()
        continue-on-error: true
        run: |
          [ "$(head -1 data/prerender-hash.txt 2>/dev/null)" != "$H0" ] || exit 0
          sleep 60   # give the deploy a minute first
          K=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//'); [ -n "$K" ] || exit 0
          curl -s -o /dev/null -w "IndexNow %{http_code}\n" -H 'Content-Type: application/json' https://api.indexnow.org/indexnow \
            -d "{\"host\":\"cavsdatabase.com\",\"key\":\"$K\",\"keyLocation\":\"https://cavsdatabase.com/$K.txt\",\"urlList\":[\"https://cavsdatabase.com/\",\"https://cavsdatabase.com/schedule\",\"https://cavsdatabase.com/roster-tree\",\"https://cavsdatabase.com/roster\",\"https://cavsdatabase.com/staff\",\"https://cavsdatabase.com/cap\",\"https://cavsdatabase.com/assets\",\"https://cavsdatabase.com/moves\",\"https://cavsdatabase.com/charge\",\"https://cavsdatabase.com/media\",\"https://cavsdatabase.com/resources\"]}" || true
