name: Update videos, box scores and news
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, so postgame pressers show up quickly
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-videos.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: node scripts/fetch-boxscores.mjs
      - name: Commit if changed
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add videos.json box.json; [ -f box-status.txt ] && git add box-status.txt || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update videos"
          git pull --rebase origin main
          git push
