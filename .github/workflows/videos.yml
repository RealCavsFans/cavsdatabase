name: Update videos, box scores and news
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes, so postgame pressers show up quickly
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-videos.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: node scripts/fetch-boxscores.mjs
      - run: node scripts/fetch-rcf.mjs
      - run: node scripts/fetch-niang.mjs
      - run: node scripts/fetch-headshots.mjs
      - name: Install headless Chrome driver (for prerendering page copies)
        run: npm i --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.0
      - run: node scripts/build-pages.mjs --prerender
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Commit if changed
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          add(){ git add videos.json box.json rcf.json; [ -f niang.json ] && git add niang.json || true; git add *.html sitemap.xml; [ -f cavs.ics ] && git add cavs.ics || true; git add -A data/prerender-hash.txt 2>/dev/null || true; [ -d img ] && git add img || true; [ -f box-status.txt ] && git add box-status.txt || true; }
          # after a push that changed the pages, tell Bing/Yandex/others (IndexNow) to recrawl
          ping(){ if git diff --name-only HEAD~1 HEAD | grep -q prerender-hash; then
            K=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//'); [ -n "$K" ] || return 0
            curl -s -o /dev/null -w "IndexNow %{http_code}\n" -H 'Content-Type: application/json' https://api.indexnow.org/indexnow \
              -d "{\"host\":\"cavsdatabase.com\",\"key\":\"$K\",\"keyLocation\":\"https://cavsdatabase.com/$K.txt\",\"urlList\":[\"https://cavsdatabase.com/\",\"https://cavsdatabase.com/schedule\",\"https://cavsdatabase.com/roster\",\"https://cavsdatabase.com/staff\",\"https://cavsdatabase.com/cap\",\"https://cavsdatabase.com/assets\",\"https://cavsdatabase.com/moves\",\"https://cavsdatabase.com/charge\",\"https://cavsdatabase.com/media\",\"https://cavsdatabase.com/resources\"]}" || true; fi; }
          add
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update videos"
          # main can move while this runs (site edits, the daily data task). If the rebase or push
          # fails, keep this run's fresh data files, rebuild the page copies on top of the latest main and retry.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then sleep 60; ping; exit 0; fi
            git rebase --abort 2>/dev/null || true
            mkdir -p /tmp/keep && cp -r videos.json box.json rcf.json niang.json /tmp/keep/ 2>/dev/null || true
            [ -d img ] && cp -r img /tmp/keep/ || true
            git fetch origin main && git reset --hard origin/main
            cp -r /tmp/keep/. . 2>/dev/null || true
            CHROME_PATH=/usr/bin/google-chrome node scripts/build-pages.mjs --prerender
            add
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update videos"
            sleep $((i*10))
          done
          exit 1
