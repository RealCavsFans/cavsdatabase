name: Cavs & Coffee newsletter
on:
  schedule:
    - cron: '37 9 * * *'   # 5:37 AM EDT / 4:37 EST: builds the issue, then waits to send at 6:19 AM ET (June 19, 2016)
    - cron: '37 10 * * *'  # 5:37 AM EST / 6:37 EDT: backup if the first run was late or skipped
    - cron: '7 11 * * *'   # last backup; the script only acts 5–8 AM ET and never sends an issue twice
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = test copy to you only; auto = normal morning run; now = send the latest game to subscribers right away (never twice)'
        default: test
        type: choice
        options: [test, auto, now]
permissions:
  contents: write
concurrency:
  group: newsletter
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          ref: main   # the latest main, not the commit the run was triggered at
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.0
      - name: Build and hand to Buttondown (waits for 6:19 AM ET)
        run: node scripts/newsletter.mjs "$MODE"
        env:
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          CHROME_PATH: /usr/bin/google-chrome
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_LIVE: ${{ vars.NEWSLETTER_LIVE || 'true' }}   # live since Oct 27, 2026 (Luka approved); set the repo variable to false to pause
      - name: Remember what went out
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add data/newsletter-sent.json nl/last-issue.html 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Newsletter issue"
          # Nov 1: six tries with a random wait, so two jobs saving at once both get through
          for i in 1 2 3 4 5 6; do  git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 15 + i * 10)); done
          exit 1
      # Nov 3: a push to Luka's phone (ntfy app, private channel in the NTFY_TOPIC secret) when this job fails
      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -s -m 15 -H "Title: cavsdatabase: ${{ github.workflow }} failed" -H "Priority: high" -H "Tags: warning" -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -d "The job stopped with an error. Tap to open the run on GitHub." "https://ntfy.sh/$NTFY_TOPIC" || true
