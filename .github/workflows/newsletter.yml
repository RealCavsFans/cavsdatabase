name: Cavs & Coffee newsletter
on:
  schedule:
    - cron: '37 9 * * *'   # 5:37 AM EDT / 4:37 EST: builds the issue, then waits to send at 6:19 AM ET (June 19, 2016)
    - cron: '37 10 * * *'  # 5:37 AM EST / 6:37 EDT: backup if the first run was late or skipped
    - cron: '7 11 * * *'   # last backup; the script only acts 5–8 AM ET and never sends an issue twice
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = test copy to you only; auto = normal morning run'
        default: test
        type: choice
        options: [test, auto]
permissions:
  contents: write
concurrency:
  group: newsletter
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.0
      - name: Build and hand to Buttondown (waits for 6:19 AM ET)
        run: node scripts/newsletter.mjs ${{ github.event.inputs.mode || 'auto' }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_LIVE: ${{ vars.NEWSLETTER_LIVE || 'true' }}   # live since Oct 27, 2026 (Luka approved); set the repo variable to false to pause
      - name: Remember what went out
        run: |
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add data/newsletter-sent.json nl/last-issue.html 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Newsletter issue"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep $((i*10)); done
          exit 1
