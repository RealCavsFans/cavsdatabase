name: Feed test (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/test-feeds.mjs
      - run: |
          git config user.name "cavsdatabase-bot"; git config user.email "bot@cavsdatabase.com"
          git add data/feed-test.txt; git commit -m "Feed test results" || exit 0
          git pull --rebase origin main; git push
