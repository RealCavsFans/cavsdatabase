name: Box score accuracy check
# Nov 1: compares each finished Cavs game's box score with Basketball Reference (scripts/bbr-check.mjs) before the
# morning health check reads the result. Rechecks a game for a few days, since the league's stat corrections land late.
on:
  schedule:
    - cron: '41 8 * * *'   # 3:41 a.m. Eastern (4:41 in summer), ahead of the 5:15 health check
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bbr-check
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0, pinned
        with:
          sparse-checkout: |
            scripts/bbr-check.mjs
            live-archive/2026-27
            data/bbr-check.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0, pinned
        with:
          node-version: 22
      - run: node scripts/bbr-check.mjs
      - name: Commit if changed
        run: |
          [ -f data/bbr-check.json ] || exit 0
          git config user.name "cavsdatabase-bot"
          git config user.email "bot@cavsdatabase.com"
          git add data/bbr-check.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Box score accuracy check"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 20 + i * 10))
          done
          exit 1
