name: probe draft
on:
  push:
    branches: [probe-draft]
    paths: [scratch-probe/draft.mjs]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: node scratch-probe/draft.mjs
      - if: always()
        run: |
          git config user.name "cavsdatabase-bot"; git config user.email "bot@cavsdatabase.com"
          git add scratch-out; git commit -m "draft probe"; git pull --rebase; git push
